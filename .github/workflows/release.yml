# Publish to PyPI on a version tag using Trusted Publishing (OIDC) — no API
# tokens. One-time setup: on PyPI, add a Trusted Publisher for this repo +
# workflow (https://docs.pypi.org/trusted-publishers/). Then: tag vX.Y.Z & push.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run the test suite before releasing
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pytest -q -m "not slow"
      - name: Build sdist + wheel
        run: |
          python -m pip install build
          python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # OIDC token for Trusted Publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
